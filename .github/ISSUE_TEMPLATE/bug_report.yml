name: Bug report
description: Report a reproducible non-security defect.
title: '[Bug] '
body:
- type: markdown
  attributes:
    value: Do not include secrets, personal information, private code or vulnerability details. For security
      concerns, follow the [security policy](https://github.com/Azvelahq/.github/blob/main/SECURITY.md).
- type: input
  id: version
  attributes:
    label: Version and environment
    description: Project, version or commit, platform and environment.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Minimal steps and expected vs. actual behavior.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Evidence
    description: Redacted logs, screenshots or test results.
  validations:
    required: false
